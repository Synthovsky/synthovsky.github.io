<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthovsky</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161923;
            --text-color: #ffffff;
            --accent-color: #00f2fe; /* Неоновый голубой */
            --accent-hover: #4facfe;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
            text-align: center;
        }

        .profile-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
            
            /* Буквы всегда горят крутым неоном, а узкий бегущий лучик (48%-52%) — чисто белый */
            background: linear-gradient(
                to right, 
                var(--accent-color) 46%, 
                #ffffff 50%, 
                var(--accent-color) 54%
            );
            background-size: 150% auto;
            background-position: 150% center;
            
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Скорость луча — 3.5 секунды. Можно поставить 3s, если хочется побыстрее */
            animation: shine 3.5s linear infinite;
        }

        /* Точное циклическое движение слева направо: от буквы S к букве y */
        @keyframes shine {
            0% {
                background-position: 150% center; /* Блик перед буквой S */
            }
            100% {
                background-position: -50% center; /* Блик ушел вправо за букву y */
            }
        }

        .profile-subtitle {
            font-size: 1rem;
            color: #8f9cae;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
        }

        .link-card {
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.15);
        }

        .link-card i {
            font-size: 1.3rem;
            color: var(--accent-color);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .social-icon {
            color: #8f9cae;
            font-size: 1.6rem;
            transition: color 0.3s ease;
        }

        .social-icon:hover {
            color: var(--accent-color);
        }

        .logo {
            background-image: url('https://avatars.githubusercontent.com/u/59468838?v=4&size=150');
            background-repeat: no-repeat;
            width: 150px;
            height: 150px;
            border-radius: 10px;
            box-shadow: 12px 12px 2px 1px rgba(0, 0, 255, 0.2);
        }  
    </style>

    <script>
        function rotate (event) 
        {
            var x = event.clientX;
            var y = event.clientY;
            var w = window.innerWidth;
            var h = window.innerHeight;
            var midpoint_x = w / 2;
            var midpoint_y = h / 2;
            var pos_x = x - midpoint_x;
            var pos_y = y - midpoint_y;
            var val_x = (pos_x / midpoint_x) * 20;
            var val_y = (pos_y / midpoint_y) * 20;
            var logo = document.getElementById ("logo");
            logo.style.transform = `perspective(200px) rotateX(${-val_y}deg) rotateY(${val_x}deg)`;
        }

        document.addEventListener("mousemove", function(event)
        {
            rotate(event)
        }, false);
        
    </script>
    
</head>
<body>

    <div class="container">
        <div class="logo" id="logo">
            &nbsp;
        </div>
        
        <!-- Заголовок и подзаголовок проекта -->
        <div class="profile-title">SYNTHOVSKY</div>
        <div class="profile-subtitle">Independent Music Producer</div>

        <!-- Основные крупные кнопки -->
        <div class="links-container">

        </div>

        </div>
    </div>

</body>
