<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Synthovsky</title>

        <style>
            :root{
                --accent-color: #00f2fe;
            }
            html, body, h1 {
                margin: 0;
                padding: 0;
            }

            body {
                height: 100%;
                box-sizing: border-box;
                font-family: sans-serif;
                background-color: #000;
                overflow: hidden;
            }

            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #0d0e15;
            }
            
            .uppercase {
                text-transform: uppercase;
            }
            
            .textflow {
                background: linear-gradient(90deg, #e933ff, #ffb400, #ff3333, #334dff, #e933ff);
                background-size: 300% auto;
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: textflow 8s linear infinite;
            }
            
            .logo {
                background-image: url('https://avatars.githubusercontent.com/u/59468838?v=4&size=150');
                background-repeat: no-repeat;
                width: 150px;
                height: 150px;
                border-radius: 10px;
                /*box-shadow: 6px 6px 2px 1px rgba(255, 255, 255, .6);*/
            }

            .profile-subtitle {
                font-size: 9px;
                color: #8f9cae;
                margin-bottom: 10px;
                text-transform: uppercase;
                letter-spacing: 2px;
            }


            .social-icons {
                display: flex;
                justify-content: center;
                gap: 20px; 
            }

            .social-icon {
                background: transparent !important;
                background-color: transparent !important;
                text-decoration: none;
                display: inline-flex;
                transition: transform 0.3s ease;
            }
            
            .social-icon:hover {
                transform: translateY(-3px); 
            }

            .social-icon svg {
                fill: #8f9cae;
                overflow: visible !important; 
                will-change: filter;
                transition: fill 0.3s ease, filter 0.3s ease;
            }
            
            .social-icon:hover svg {
                fill: #ffffff; /* Мягко загорается белым */
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
            }

            @keyframes textflow {
                from {background-position: 50% center}         
                to {background-position: -250% center}
            }

        </style>

        <script>
            let logo;

            document.addEventListener("DOMContentLoaded", function() {
                logo = document.getElementById("logo");
            });
            
            function rotate (event) 
            {
                if (!logo) return; 

                var x = event.clientX;
                var y = event.clientY;
                var w = window.innerWidth;
                var h = window.innerHeight;
                var midpoint_x = w / 2;
                var midpoint_y = h / 2;
                var pos_x = x - midpoint_x;
                var pos_y = y - midpoint_y;
                var val_x = (pos_x / midpoint_x) * 20;
                var val_y = (pos_y / midpoint_y) * 20;
                logo.style.transform = `perspective(200px) rotateX(${-val_y}deg) rotateY(${val_x}deg)`;
            }

            document.addEventListener("mousemove", function(event)
            {
                rotate(event)
            }, false);
            
        </script>
    </head>
    <body>
        <div class="container">
            <div class="element-to-center">
                <center>
                    <br>
                    <div class="logo" id="logo">
                        &nbsp;
                    </div>
                    <br>
                    <h1>
                        <b>
                            <div class="uppercase textflow">Synthovsky</div>
                        </b>
                    </h1>
                    
                    <div class="profile-subtitle">Independent Music Producer</div>
                    
                    <div class="social-icons">
                        <a href="https://www.youtube.com/@Synthovsky" target="_blank" class="social-icon" title="YouTube">
                            <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                        </a>
                        <a href="https://www.instagram.com/synthovsky/" target="_blank" class="social-icon" title="Instagram">

                        </a>
                    </div>
                </center>
            </div>
        </div>
    </body>
</html>
